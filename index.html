<style>

.logo{font-size:15px;font-weight:800;letter-spacing:.08em}.meta{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:7px}.speed{display:flex;gap:2px}.speed button{height:22px;min-width:24px;padding:0 4px;border:1px solid var(--border);border-radius:4px;background:#fff;color:var(--muted);font-size:9px;font-weight:800;cursor:pointer}.speed button.active{background:#eef3f8;color:var(--accent);border-color:var(--accent)}.meta select{height:22px;border:1px solid var(--border);border-radius:4px;background:#fff;color:var(--muted);font-size:9px;font-weight:800;padding:0 2px}.meta b{color:var(--text)}.top-new{height:24px;padding:0 7px;border:1px solid var(--border);border-radius:5px;background:#fff;color:var(--muted);font-size:9px;font-weight:800;cursor:pointer}.top-new:hover{border-color:var(--accent);color:var(--accent)}
main{flex:1;overflow:auto;padding:7px}.box{background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:7px;box-shadow:0 1px 2px #00000008}.title{height:30px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
#lines{display:grid;grid-template-columns:repeat(5,var(--line-width));gap:6px;overflow:hidden;padding:6px}.line-wrap{width:var(--line-width);display:flex;flex-direction:column;gap:4px}.line{width:var(--line-width);height:320px;background:var(--panel2);border:1px solid var(--lc);border-radius:8px;overflow:hidden}.lhead{padding:6px 7px;border-bottom:1px solid var(--border);border-top:4px solid var(--lc)}.lname{font-size:20px;line-height:20px;font-weight:850;color:var(--lc)}.stat{font-size:10px;color:var(--muted);line-height:1.25}.stat b{color:var(--text)}
.queue{padding:6px 5px;display:grid;grid-template-columns:repeat(4,var(--slot-size));grid-auto-rows:var(--slot-size);row-gap:1px;column-gap:2px;position:relative;overflow:visible;align-content:start}.snake-path{position:absolute;left:5px;top:6px;width:calc(100% - 10px);height:calc(100% - 12px);z-index:0;pointer-events:none;overflow:visible}.snake-path path{fill:none;stroke:var(--lc);stroke-width:1;opacity:.65;stroke-linecap:square}.slot{z-index:1}.slot{width:var(--slot-size);height:var(--slot-size);border:1px solid var(--lc);border-radius:3px;display:flex;align-items:center;justify-content:center;background:#fff;color:#a5adb5;font-size:8px;font-weight:750;min-width:0;position:relative}.slot.active-empty{background:color-mix(in srgb,var(--lc) 24%,#fff);border-color:var(--lc);color:transparent}.slot.filled{color:#fff;border-color:var(--pc);background:var(--pc)}.slot.inactive{border-color:#cfd4d9!important;background:#eef0f2!important;color:#b8bec4!important;opacity:1}.slot.preview{border:1px dashed var(--pc);background:#fff;color:var(--pc);font-weight:850}#turn{display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 8px 4px;font-size:12px;font-weight:650}.turn-msg{flex:1;text-align:center}.turn-wait{height:30px;min-width:58px;padding:0 8px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text);font-size:10px;font-weight:750;cursor:pointer}.turn-wait:disabled{opacity:.35;cursor:not-allowed}.turn{font-weight:800;color:var(--accent)}.status{font-size:10px;color:var(--muted);text-align:center;padding:6px 8px;border-top:1px solid var(--border);background:var(--panel2)}
.line-action{height:36px;width:var(--line-width);border:1px solid var(--lc);border-radius:7px;background:#fff;color:var(--text);font-size:11px;font-weight:750;cursor:pointer}.line-action:hover:not(:disabled){border-color:var(--lc);background:color-mix(in srgb,var(--lc) 9%,#fff)}.line-action:disabled{opacity:.35;cursor:not-allowed}.line-action.active{box-shadow:0 0 0 2px color-mix(in srgb,var(--lc) 20%,transparent)}button:disabled{opacity:.35;cursor:not-allowed}
#players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:6px;overflow:hidden}.player{background:var(--panel2);border:1px solid var(--pc);border-top:3px solid var(--pc);border-radius:8px;padding:6px}.player.current{box-shadow:0 0 0 2px color-mix(in srgb,var(--pc) 25%,transparent)}.phead{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:var(--pc)}.total{font-size:16px;color:var(--text)}
table{border-collapse:collapse;margin:5px auto 0;font-size:7px;text-align:center;table-layout:fixed;width:max-content}th,td{border:1px solid var(--border);padding:0;width:18px;height:18px;min-width:18px;max-width:18px;line-height:18px}th{color:var(--muted);font-weight:750}td.hit{background:color-mix(in srgb,var(--pc) 16%,#fff);color:var(--pc);font-weight:850}.score-line{font-weight:800}
#log{height:95px;overflow:auto;padding:6px;font-size:9px;line-height:1.45;color:var(--muted)}.reward{color:var(--good);font-weight:700}.error{color:var(--danger)}
.bottom{height:54px;display:flex;gap:6px;padding:7px;background:var(--panel);border-top:1px solid var(--border)}.bottom button{flex:1}.primary{background:#f5f7fa!important;border-color:#aeb8c2!important}
#action-feed{min-height:36px;margin:0 6px 6px;padding:6px 9px;border:1px solid var(--border);border-radius:7px;background:var(--panel2);display:flex;align-items:center;justify-content:center;text-align:center}.action-feed .who{font-size:9px;font-weight:850;letter-spacing:.08em;color:var(--pc,#4169a1);text-transform:uppercase}.action-feed .what{margin-left:7px;font-size:11px;font-weight:850;color:var(--text);letter-spacing:.02em}.action-feed .detail{margin-left:6px;font-size:9px;color:var(--muted)}.action-feed.empty{color:#a2a9b0;font-size:9px}.action-stage{position:fixed;inset:0;pointer-events:none;z-index:30;display:none}.action-arrow{position:absolute;overflow:visible}.action-arrow path{fill:none;stroke:var(--pc,#4169a1);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.action-arrow polygon{fill:var(--pc,#4169a1)}.action-ghost{fill:#fff;stroke:#aeb5bc;stroke-width:1.5;stroke-dasharray:4 3}.action-ghost-text{fill:#aeb5bc;font-size:10px;font-weight:850;text-anchor:middle;dominant-baseline:middle}.action-current{fill:var(--pc,#4169a1);stroke:var(--pc,#4169a1);stroke-width:1.5}.action-current-text{fill:#fff;font-size:10px;font-weight:850;text-anchor:middle;dominant-baseline:middle}.ai-token{cursor:pointer}.ai-token:hover{filter:brightness(1.08)}.ai-token.replay{outline:2px solid var(--pc);outline-offset:2px;animation:tokenPulse .55s ease-out 2}@keyframes tokenPulse{50%{transform:scale(1.14)}}@media(max-width:430px){.action-feed{margin-left:4px;margin-right:4px}.action-feed .what{font-size:10px}}
#modal{display:none;position:fixed;inset:0;background:#17212b66;align-items:center;justify-content:center;padding:18px}.modal{width:min(360px,100%);background:#fff;border:1px solid var(--border);padding:17px;border-radius:10px;box-shadow:0 12px 40px #0002}.modal h2{margin:0 0 8px;font-size:19px}.modal button{width:100%;margin-top:14px;height:36px;border:1px solid var(--border);border-radius:7px;background:#fff}
@media(max-width:430px){#app{width:100%;--line-width:calc((100vw - 38px)/5);--slot-size:calc((var(--line-width) - 10px - 6px)/4);}.line{width:var(--line-width);height:320px}.line-wrap{width:var(--line-width)}#lines{grid-template-columns:repeat(5,var(--line-width));gap:4px;padding:6px 4px}.queue{padding:6px 5px;grid-template-columns:repeat(4,var(--slot-size));column-gap:2px;row-gap:1px}.slot{width:var(--slot-size);height:var(--slot-size);font-size:7px}.line-action{width:var(--line-width);font-size:9px}.bottom button{min-width:0}.player{min-width:0}table{font-size:7px}th,td{width:18px;height:18px;min-width:18px;max-width:18px;line-height:18px}}
</style>

<body>
<div id="app">
<header><div class="logo">STAMP GAME</div><button id="newTop" class="top-new">NEW GAME</button><div class="meta"><div class="speed" aria-label="AI speed"><button data-speed="1">X1</button><button data-speed="2">X2</button><button data-speed="4" class="active">X4</button></div><select id="aiLevel" aria-label="AI difficulty"><option value="easy">EASY</option><option value="normal" selected>NORMAL</option><option value="hard">HARD</option></select><span>R1 · P<b id="phase">-</b>/30</span></div></header>
<main>
<section class="box"><div class="title"><span>LINES</span><span>PHASE START</span></div><div id="lines"></div><div id="turn"><span class="turn-msg"></span><button id="wait" class="turn-wait" disabled>WAIT</button></div><div id="action-feed" class="action-feed empty">AI ACTIONS WILL APPEAR HERE</div><div id="actions"></div><div id="status" class="status"></div></section>
<section class="box"><div class="title"><span>PLAYER SCOREBOARD</span><span>INDIVIDUAL</span></div><div id="players"></div></section>
<section class="box"><div class="title"><span>EVENT LOG</span></div><div id="log"></div></section>
</main>

</div>
<div id="action-stage" class="action-stage"><svg id="action-arrow" class="action-arrow" aria-hidden="true"></svg></div>
<div id="modal"><div class="modal"><h2>GAME END</h2><div id="modalText"></div><button id="modalClose" type="button">CLOSE</button><button id="modalNew" type="button">NEW GAME</button></div></div>
<script>
'use strict';
const MAX_QUEUE=21;
let D=null,S=null,timer=null,pendingLine=null,gameSpeed=4,actionTimer=null,lastActions={};
const AI_DELAYS={1:1680,2:840,4:420};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cls=p=>p==='Human'?'H':p==='AI 1'?'A1':p==='AI 2'?'A2':'A3';
const lineColors={A:'#DAA520',B:'#C75BAD',C:'#5BA8C7',D:'#7DBF5E',E:'#C7875B'};
const playerColors={Human:'#355C9A','AI 1':'#B24C6F','AI 2':'#3E8A68','AI 3':'#8A6A32'};
const weighted=o=>{const a=Object.entries(o).map(([v,w])=>[+v,+w]).filter(x=>Number.isFinite(x[0])&&x[1]>0);if(!a.length)return 0;const total=a.reduce((s,x)=>s+x[1],0);let r=Math.random()*total;for(const [v,w] of a){r-=w;if(r<=0)return v}return a[a.length-1][0]};
const line=id=>S.lines[String(id)];
function log(x,c=''){const e=document.createElement('div');e.className=c;e.textContent=x;document.querySelector('#log').prepend(e)}
function scoreRows(lid){const row=D.score_table.find(r=>String(r.line_pool_id)===String(lid));return row?[row.tier1,row.tier2,row.tier3,row.tier4,row.tier5]:[0,0,0,0,0]}
function scoreFor(p,l){const c=S.players[p].by[l.id]||0;if(!c)return 0;const r=scoreRows(l.id);return r[Math.min(c-1,4)]||0}
function total(p){return D.lines.reduce((n,l)=>n+scoreFor(p,l),0)}
function resetState(){clearTimeout(timer);clearTimeout(actionTimer);pendingLine=null;lastActions={};hideAction();document.querySelector('#modal').style.display='none';S={phase:1,order:[],idx:0,lines:{},players:{},running:true,resolving:false};D.lines.forEach(l=>S.lines[String(l.id)]={buffer:[],rewards:{}});D.players.forEach(p=>{S.players[p]={by:{}};D.lines.forEach(l=>S.lines[String(l.id)].rewards[p]=0)});document.querySelector('#log').innerHTML='';log('NEW GAME');startPhase()}
function bufferProbabilities(type){const row=D.buffer_types.find(r=>r.name===type);if(!row)return {};if(typeof row.probabilities==='string'){try{return JSON.parse(row.probabilities)}catch{return {}}}return row.probabilities||{}}
function addBuffer(){const mp={};for(const r of D.line_phase_map||[]){if(+r.phase_number===S.phase){const bt=D.buffer_types.find(x=>+x.id===+r.buffer_type_id);if(bt)mp[r.line_pool_id]=bt.name}}
 D.lines.forEach(l=>{const typ=mp[l.id]||'Normal',prob=bufferProbabilities(typ),s=line(l.id),drawn=+weighted(prob),add=Math.min(MAX_QUEUE-s.buffer.length,Math.max(0,drawn));for(let i=0;i<add;i++)s.buffer.push(null);if(add)log(`P${S.phase} · ${l.name} +${add} (${typ})`)});
}
function startPhase(){if(!S.running)return;S.resolving=false;addBuffer();S.order=[...D.players].sort(()=>Math.random()-0.5);S.idx=0;log(`PHASE ${S.phase} START · ORDER ${S.order.join(' → ')}`);render();next()}
function removePlayer(p){D.lines.forEach(l=>{const b=line(l.id).buffer;for(let i=0;i<b.length;i++)if(b[i]===p)b[i]=null})}
function choose(p,id){if(!S.running||S.resolving)return false;const l=D.lines.find(x=>String(x.id)===String(id));if(!l)return false;const target=line(l.id).buffer;if(target.includes(p))return true;if(target.length>=MAX_QUEUE)return false;removePlayer(p);target.push(p);log(`${p} → ${l.name}`);render();return true}
function resolve(l){const s=line(l.id),b=s.buffer,players=[...new Set(b.filter(Boolean))];if(!players.length){let removed=0,n=[];for(const x of b){if(x===null&&removed<l.fixed_value)removed++;else n.push(x)}s.buffer=n;return []}
 const front=new Set(b.slice(0,l.fixed_value).filter(Boolean));if(players.length===front.size&&players.every(p=>front.has(p))){s.buffer=b.slice(l.fixed_value);return players}
 let removed=0,n=[];for(const x of b){if(x===null&&removed<l.fixed_value)removed++;else n.push(x)}s.buffer=n;return []}
function lineRewardUsed(lid){const s=line(lid);return D.players.reduce((n,p)=>n+(s.rewards[p]||0),0)}
function lineRewardRemaining(l){return Math.max(0,l.max_rewards-lineRewardUsed(l.id))}
function resolvePhase(){if(S.resolving||!S.running)return;S.resolving=true;const rewards=[];D.lines.forEach(l=>{const winners=resolve(l);if(!winners.length)return;const remaining=lineRewardRemaining(l);if(remaining<winners.length){log(`PASS · ${l.name} · ${winners.length} players crossed, but only ${remaining} Reward left · NO REWARD`);return}const s=line(l.id);winners.forEach(p=>{s.rewards[p]++;S.players[p].by[l.id]=(S.players[p].by[l.id]||0)+1;rewards.push([p,l.name,s.rewards[p],scoreFor(p,l)]);log(`REWARD · ${p} · ${l.name} ×${s.rewards[p]} · SCORE ${scoreFor(p,l)}`,'reward')})});render();
 const win=D.players.filter(p=>D.lines.every(l=>(S.players[p].by[l.id]||0)>=3));if(win.length)return end(win.join(', ')+' WIN');
 const exhausted=D.lines.every(l=>lineRewardRemaining(l)<=0);if(exhausted)return end('ALL REWARDS EXHAUSTED');
 if(S.phase>=D.max_phases)return end(`${D.max_phases} PHASES REACHED`);
 S.phase++;startPhase()}
/* AI decision model
   Each AI evaluates the board only at its own turn. Earlier players' actual
   moves are visible; later players do not pre-commit or receive future intent.
   Difficulty changes how strongly the AI values blocking and how much noise it adds.
*/
const AI_LEVELS={
  easy:{self:10000,block:0,score:6,position:100,noise:150},
  normal:{self:10000,block:24,score:12,position:180,noise:24},
  hard:{self:10000,block:60,score:16,position:220,noise:6}
};
let aiLevel='normal';
function cloneBuffers(){const out={};D.lines.forEach(l=>{out[l.id]=line(l.id).buffer.slice()});return out}
function projectedPhase(buffers){
  const result={rewardBy:{}};
  D.players.forEach(p=>result.rewardBy[p]=0);
  D.lines.forEach(l=>{
    const b=buffers[l.id]||[], players=[...new Set(b.filter(Boolean))];
    if(!players.length){
      let removed=0,n=[];for(const x of b){if(x===null&&removed<l.fixed_value)removed++;else n.push(x)}
      buffers[l.id]=n;return;
    }
    const front=new Set(b.slice(0,l.fixed_value).filter(Boolean));
    const passed=players.length===front.size&&players.every(x=>front.has(x));
    if(passed){
      const remaining=lineRewardRemaining(l); // actual current remaining capacity
      // The action simulation uses the same all-or-nothing simultaneous rule.
      if(remaining>=players.length)players.forEach(p=>result.rewardBy[p]++);
      buffers[l.id]=b.slice(l.fixed_value);
    }else{
      let removed=0,n=[];for(const x of b){if(x===null&&removed<l.fixed_value)removed++;else n.push(x)}
      buffers[l.id]=n;
    }
  });
  return result;
}
function applyAIAction(buffers,p,lid){
  const target=buffers[lid];
  if(!target||target.length>=MAX_QUEUE&&!target.includes(p))return false;
  D.lines.forEach(l=>{const b=buffers[l.id];for(let i=0;i<b.length;i++)if(b[i]===p)b[i]=null});
  if(!target.includes(p))target.push(p);
  return true;
}
function simulateAction(p,lid){
  const buffers=cloneBuffers();
  if(!applyAIAction(buffers,p,lid))return null;
  const before={};
  D.players.forEach(x=>before[x]=0);
  const result=projectedPhase(buffers);
  return {rewardBy:result.rewardBy,buffers};
}
function currentThreats(){
  const base=cloneBuffers(), result=projectedPhase(base), out={};
  D.players.forEach(p=>out[p]=result.rewardBy[p]||0);
  return out;
}
function actionDeltaForOpponent(candidate,p,opp,baseThreat){
  // Normal play should not cause the AI to chase an opponent merely because
  // that opponent can also score this phase. Blocking is reserved for a real
  // 3rd-Reward win threat. This prevents several AIs from piling onto the
  // same line simply because Human entered it.
  const currentLine=D.lines.find(l=>line(l.id).buffer.includes(opp));
  const projectedLine=D.lines.find(l=>candidate.buffers[l.id].includes(opp));
  const beforeCount=Math.max(0,...D.lines.map(l=>S.players[opp].by[l.id]||0));
  if(beforeCount<2)return 0;

  const beforeReward=baseThreat[opp]||0;
  const afterReward=candidate.rewardBy[opp]||0;
  const projectedCounts=D.lines.map(l=>{
    const gained=(afterReward>0&&projectedLine&&String(l.id)===String(projectedLine.id))?1:0;
    return (S.players[opp].by[l.id]||0)+gained;
  });
  const afterCount=Math.max(0,...projectedCounts);
  if(afterCount>=3)return 0;

  // Reward capacity can also make an apparent 3rd reward disappear. Only
  // value the action when it actually removes that immediate win.
  const stopsWin=beforeCount>=2 && beforeReward>0;
  if(!stopsWin)return 0;
  const beforeScore=scoreFor(opp,currentLine||D.lines[0]);
  const afterScore=afterReward>0&&projectedLine?scoreFor(opp,projectedLine):0;
  return Math.max(0,beforeScore-afterScore)+55;
}
function actionPosition(buffers,p,lid){
  const b=buffers[lid]||[], pos=b.indexOf(p); if(pos<0)return 999;
  const fv=D.lines.find(l=>String(l.id)===String(lid)).fixed_value;
  return pos<fv ? (fv-pos) : Math.max(0,fv-(pos));
}
function aiCandidate(p,l,baseThreat){
  const current=line(l.id).buffer;
  const already=current.includes(p);
  const sim=simulateAction(p,l.id);
  if(!sim)return null;
  const cfg=AI_LEVELS[aiLevel]||AI_LEVELS.normal;
  const selfReward=sim.rewardBy[p]||0;
  let score=selfReward*cfg.self;
  // Blocking is evaluated player-by-player, including cases where the AI gains nothing.
  D.players.filter(opp=>opp!==p).forEach(opp=>{
    const blocked=actionDeltaForOpponent(sim,p,opp,baseThreat);
    if(blocked>0)score+=blocked*cfg.block;
  });
  const nextScore=scoreRows(l.id)[Math.min(S.players[p].by[l.id]||0,4)]||0;
  score+=nextScore*cfg.score;
  score+=Math.max(0,actionPosition(sim.buffers,p,l.id))*cfg.position;
  if(already)score+=35; // small inertia only; never enough to override reward/blocking.
  score-=sim.buffers[l.id].filter(x=>x&&x!==p).length*3;
  score+=(Math.random()-0.5)*cfg.noise;
  return {l,action:already?'STAY':'MOVE',score,sim};
}
function ai(p){
  if(!S.running||S.resolving||S.order[S.idx]!==p)return;
  const baseThreat=currentThreats();
  const opts=D.lines.map(l=>aiCandidate(p,l,baseThreat)).filter(Boolean);
  opts.sort((a,b)=>b.score-a.score);
  if(!opts.length){S.idx++;next();return}
  const best=opts[0].score;
  // Difficulty controls both precision and willingness to break ties.
  const cfg=AI_LEVELS[aiLevel]||AI_LEVELS.normal;
  const tieWindow=aiLevel==='hard'?4:aiLevel==='normal'?18:70;
  const top=opts.filter(x=>best-x.score<=tieWindow);
  const pick=top[Math.floor(Math.random()*top.length)];
  const fromPos=getPlayerPosition(p);
  const action=pick.action==='STAY'
    ? {player:p,type:'stay',from:pick.l.name,to:pick.l.name,toIndex:getPlayerPosition(p)?.index??null,label:p.replace('AI ','A')}
    : {player:p,type:fromPos?'move':'enter',from:fromPos?fromPos.line.name:null,fromIndex:fromPos?fromPos.index:null,to:pick.l.name,toIndex:(line(pick.l.id).buffer.length),label:p.replace('AI ','A')};
  lastActions[p]=action;
  if(pick.action==='STAY')log(`${p} · STAY · ${pick.l.name}`);
  else choose(p,pick.l.id);
  showAction(action);
  S.idx++;next();
}
function next(){if(!S.running||S.resolving)return;if(S.idx>=S.order.length){resolvePhase();return}const p=S.order[S.idx];render();if(p==='Human')return;clearTimeout(timer);timer=setTimeout(()=>ai(p),AI_DELAYS[gameSpeed])}
function playerLabel(p){return p==='Human'?'YOU':p}
function getPlayerLine(p){return D.lines.find(l=>line(l.id).buffer.includes(p))||null}
function getPlayerPosition(p){
 const l=getPlayerLine(p); if(!l)return null;
 const b=line(l.id).buffer, index=b.indexOf(p);
 return {line:l,index};
}
function hideAction(){
 const stage=document.querySelector('#action-stage'); if(stage)stage.style.display='none';
 const arrow=document.querySelector('#action-arrow'); if(arrow)arrow.innerHTML='';
}
function actionText(a){
 if(a.type==='stay')return {what:`STAYS · ${a.to}`,detail:'CURRENT LINE'};
 if(a.type==='enter')return {what:`ENTERS · ${a.to}`,detail:'NEW LINE'};
 return {what:`MOVES · ${a.from} → ${a.to}`,detail:'LINE CHANGE'};
}
function setActionFeed(a,replay=false){
 const el=document.querySelector('#action-feed'); if(!el)return;
 const t=actionText(a),pc=playerColors[a.player]||'#4169a1';
 el.classList.remove('empty'); el.style.setProperty('--pc',pc);
 el.innerHTML=`<span class="who">${esc(playerLabel(a.player))}</span><span class="what">${esc(t.what)}</span><span class="detail">${esc(t.detail)}${replay?' · LAST ACTION':''}</span>`;
}
function slotViewportPosition(lineName,index){
 const wrap=document.querySelector(`.line-wrap[data-line-name="${CSS.escape(lineName)}"]`);
 if(!wrap)return null;
 const q=wrap.querySelector('.queue'); if(!q)return null;
 const cs=getComputedStyle(q), size=parseFloat(cs.getPropertyValue('--slot-size'))||parseFloat(getComputedStyle(document.documentElement).fontSize)||17;
 const colGap=parseFloat(cs.columnGap)||2,rowGap=parseFloat(cs.rowGap)||1;
 const fv=Number(D.lines.find(l=>String(l.name)===String(lineName)).fixed_value);
 const row=Math.floor(index/fv),pos=index%fv,col=row%2===0?pos:fv-1-pos;
 const qr=q.getBoundingClientRect();
 return {x:qr.left+5+col*(size+colGap)+size/2,y:qr.top+6+row*(size+rowGap)+size/2,size};
}
function showAction(a,replay=false){
 const stage=document.querySelector('#action-stage'),arrow=document.querySelector('#action-arrow');
 if(!stage||!arrow)return;
 clearTimeout(actionTimer); setActionFeed(a,replay); stage.style.display=replay?'block':'none'; arrow.innerHTML='';
 const pc=playerColors[a.player]||'#4169a1';
 if(replay&&a.type==='move'&&a.from&&a.fromIndex!=null&&a.toIndex!=null){
   const from=slotViewportPosition(a.from,a.fromIndex),to=slotViewportPosition(a.to,a.toIndex);
   if(from&&to){
     const pad=18, minX=Math.min(from.x,to.x)-pad-12,minY=Math.min(from.y,to.y)-pad-12,maxX=Math.max(from.x,to.x)+pad+12,maxY=Math.max(from.y,to.y)+pad+12,w=Math.max(60,maxX-minX),h=Math.max(60,maxY-minY);
     arrow.style.left=`${minX}px`; arrow.style.top=`${minY}px`; arrow.style.width=`${w}px`; arrow.style.height=`${h}px`; arrow.setAttribute('viewBox',`0 0 ${w} ${h}`);
     const sx=from.x-minX,sy=from.y-minY,tx=to.x-minX,ty=to.y-minY,dx=tx-sx,dy=ty-sy,len=Math.max(1,Math.hypot(dx,dy)),gap=10;
     const ax=sx+dx/len*(from.size/2+gap),ay=sy+dy/len*(from.size/2+gap),bx=tx-dx/len*(to.size/2+gap),by=ty-dy/len*(to.size/2+gap),ang=Math.atan2(by-ay,bx-ax),sz=11;
     const p1x=bx-sz*Math.cos(ang-Math.PI/6),p1y=by-sz*Math.sin(ang-Math.PI/6),p2x=bx-sz*Math.cos(ang+Math.PI/6),p2y=by-sz*Math.sin(ang+Math.PI/6);
     arrow.innerHTML=`<rect class="action-ghost" x="${sx-from.size/2}" y="${sy-from.size/2}" width="${from.size}" height="${from.size}" rx="3"></rect><text class="action-ghost-text" x="${sx}" y="${sy}">${esc(a.label||a.player.replace('AI ','A'))}</text><path d="M ${ax} ${ay} L ${bx} ${by}" style="--pc:${pc}"></path><polygon points="${bx},${by} ${p1x},${p1y} ${p2x},${p2y}" style="--pc:${pc}"></polygon>`;
   }
 } else if(replay&&(a.type==='stay'||a.type==='enter')){
   const pos=a.toIndex!=null?slotViewportPosition(a.to,a.toIndex):null;
   if(pos){const x=pos.x,y=pos.y; arrow.style.left=`${x-24}px`;arrow.style.top=`${y-24}px`;arrow.style.width='48px';arrow.style.height='48px';arrow.setAttribute('viewBox','0 0 48 48');arrow.innerHTML=`<rect class="action-current" x="12" y="12" width="24" height="24" rx="4" style="--pc:${pc}"></rect><text class="action-current-text" x="24" y="24">${esc(a.label||a.player.replace('AI ','A'))}</text>`;}
 }
 const duration=replay?1300:(gameSpeed===4?900:gameSpeed===2?1050:1200); actionTimer=setTimeout(hideAction,duration);
}
function replayAI(p){const a=lastActions[p];if(a)showAction(a,true)}
function human(id){if(!S.running||S.resolving||S.order[S.idx]!=='Human')return;const l=D.lines.find(x=>String(x.id)===String(id));if(!l)return;const s=line(l.id);const same=s.buffer.includes('Human');if(String(pendingLine)===String(id)){pendingLine=null;if(same){log('Human · WAIT');S.idx++;next()}else if(choose('Human',id)){S.idx++;next()}}else{pendingLine=id;render()}}
function wait(){if(S.running&&!S.resolving&&S.order[S.idx]==='Human'){pendingLine=null;log('Human · WAIT');S.idx++;next()}}
document.querySelector('#aiLevel').addEventListener('change',e=>{aiLevel=e.target.value});document.querySelector('#wait').addEventListener('click',wait);document.querySelector('#newTop').addEventListener('click',resetState);document.querySelector('#modalClose').addEventListener('click',()=>{document.querySelector('#modal').style.display='none'});document.querySelector('#modalNew').addEventListener('click',resetState);document.querySelectorAll('.speed button').forEach(btn=>btn.addEventListener('click',()=>{gameSpeed=+btn.dataset.speed;document.querySelectorAll('.speed button').forEach(b=>b.classList.toggle('active',b===btn));}));
function render(){
 if(!D||!S)return;
 document.querySelector('#phase').textContent=S.phase;
 const p=S.order[S.idx];
 document.querySelector('.turn-msg').innerHTML=p?`TURN · <span class="turn">${esc(p)}</span>`:'RESOLVING';
 document.querySelector('#status').textContent=S.running?(p==='Human'?(pendingLine!==null?'한 번 더 누르면 확정됩니다.':'라인을 선택하면 마지막 위치가 미리 표시됩니다.'):'AI가 선택 중입니다.'):'GAME OVER';
 document.querySelector('#wait').disabled=!(S.running&&!S.resolving&&p==='Human');
 const L=document.querySelector('#lines'); L.innerHTML='';
 D.lines.forEach(l=>{
   const s=line(l.id),slots=21;
   let q='';
   const cc=lineColors[l.name]||'#888';
   // Snake path: connect the centers of consecutive slots. Horizontal runs
   // alternate direction; the row transition is a vertical segment at the end point.
   const fv=Number(l.fixed_value);
   const posOf=i=>{
     const row=Math.floor(i/fv);
     const pos=i%fv;
     const col=row%2===0?pos:fv-1-pos;
     return {row:row*2+1,col};
   };
   for(let i=0;i<slots;i++){
     const {row,col}=posOf(i);
     const x=s.buffer[i]||null;
     const preview=!x&&!s.buffer.includes('Human')&&String(pendingLine)===String(l.id)&&p==='Human'&&i===s.buffer.length;
     const state=x?'filled '+cls(x):(preview?'preview':(i<s.buffer.length?'active-empty':'inactive'));
     q+=`<div class="slot ${state}${x&&x!=='Human'?' ai-token':''}" data-player="${x?esc(x):''}" title="${x&&x!=='Human'?'CLICK FOR LAST ACTION':''}" style="grid-row:${row};grid-column:${col+1};--pc:${x?(playerColors[x]||'#607080'):(preview?playerColors.Human:'transparent')};--lc:${cc}">${x?esc(x==='Human'?'H':x.replace('AI ','A')):preview?'H':''}</div>`;
   }
   const rowCount=Math.ceil(slots/fv);
   const pathParts=[];
   // Only draw the vertical turn connectors between rows. Horizontal lines
   // overlap the buffer row/slot borders and make the Snake harder to read.
   for(let row=0;row<rowCount-1;row++){
     const lastIndex=Math.min(slots-1,(row+1)*fv-1);
     const nextIndex=lastIndex+1;
     if(nextIndex>=slots)break;
     const lastCol=row%2===0?fv-1:0;
     const nextRow=Math.floor(nextIndex/fv);
     const nextPos=nextIndex%fv;
     const nextCol=nextRow%2===0?nextPos:fv-1-nextPos;
     const x1=((lastCol+0.5)/4)*100;
     const x2=((nextCol+0.5)/4)*100;
     const y1=(row+0.5)/rowCount*100;
     const y2=(nextRow+0.5)/rowCount*100;
     pathParts.push(`M ${x1} ${y1} L ${x2} ${y2}`);
   }
   q+=`<svg class="snake-path" style="--lc:${cc}" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="${pathParts.join(' ')}"></path></svg>`;
   const isHumanTurn=p==='Human'&&!S.resolving&&S.running;
   const can=isHumanTurn;
   const pending=String(pendingLine)===String(l.id)&&isHumanTurn;
   const buttonLabel=pending?'CONFIRM '+l.name:(s.buffer.length>=MAX_QUEUE&&!s.buffer.includes('Human')?'FULL · '+l.name:'LINE '+l.name);
   L.insertAdjacentHTML('beforeend',`<div class="line-wrap" data-line-name="${esc(l.name)}">
     <div class="line" style="--lc:${lineColors[l.name]||'#888'}">
       <div class="lhead"><div class="lname">${esc(l.name)}</div><div class="stat">FV <b>${l.fixed_value}</b></div><div class="stat">Reward <b>${lineRewardRemaining(l)}/${l.max_rewards}</b></div><div class="stat">Max <b>21</b></div></div>
       <div class="queue">${q}</div>
     </div>
     <button class="line-action ${pending?'active':''}" style="--lc:${lineColors[l.name]||'#888'}" data-line="${esc(l.id)}" ${can?'':'disabled'}>${buttonLabel}</button>
   </div>`);
 });
 document.querySelectorAll('.line-action').forEach(btn=>btn.addEventListener('click',()=>human(btn.dataset.line)));document.querySelectorAll('.ai-token').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();replayAI(el.dataset.player)}));
 document.querySelector('#actions').innerHTML='';
 document.querySelector('#players').innerHTML=D.players.map(x=>{
   const pc=playerColors[x]||'#607080';
   const rows=D.lines.map(l=>{const c=S.players[x].by[l.id]||0,r=scoreRows(l.id);return `<tr><td class="score-line" style="color:${lineColors[l.name]||'#555'}">${esc(l.name)}</td>${r.map((z,i)=>`<td class="${c===i+1||c>5&&i===4?'hit':''}">${z}</td>`).join('')}<td>${c}</td></tr>`}).join('');
   return `<div class="player ${x===p?'current':''}" style="--pc:${pc}"><div class="phead"><span>${esc(x)}</span><span class="total">${total(x)}</span></div><table><tr><th>LINE</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5+</th><th>R</th></tr>${rows}</table></div>`
 }).join('');
}
function end(x){S.running=false;S.resolving=false;render();document.querySelector('#modalText').textContent=x;document.querySelector('#modal').style.display='flex'}
async function boot(){try{const r=await fetch('./data/gameData.json',{cache:'no-store'});if(!r.ok)throw new Error(`data/gameData.json HTTP ${r.status}`);D=await r.json();if(!D.lines||!D.players)throw new Error('gameData.json 형식이 올바르지 않습니다.');resetState()}catch(e){console.error(e);document.querySelector('#turn').textContent='GAME DATA LOAD ERROR';document.querySelector('#status').textContent=e.message;log(`ERROR · ${e.message}`,'error')}}
boot();
</script>
</body></html>
