<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STAMP / QUEUE</title>
<style>
:root{
  --bg:#eef1f4;--panel:#fff;--panel2:#f7f9fb;--line:#d6dde5;--text:#26313b;--muted:#73808c;
  --human:#355c9a;--ai1:#b24c6f;--ai2:#3e8a68;--ai3:#8a6a32;
  --a:#daa520;--b:#c75bad;--c:#5ba8c7;--d:#7dbf5e;--e:#c7875b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif}
button,select{font:inherit}
button{cursor:pointer}
#app{width:min(760px,100%);margin:0 auto;padding:10px 10px 18px}
.topbar{height:44px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.brand{font-size:18px;font-weight:900;letter-spacing:.11em;margin-right:auto}.brand small{display:block;font-size:7px;letter-spacing:.16em;color:var(--muted);font-weight:800;margin-top:-2px}
.ctrl{display:flex;gap:3px;align-items:center}.ctrl button,.ctrl select,.new{height:27px;border:1px solid #cbd3dc;border-radius:5px;background:#fff;color:#586571;font-size:10px;font-weight:800;padding:0 7px}.ctrl button.active{border-color:#4169a1;color:#4169a1;background:#f0f4f9}.new{padding:0 9px;color:#3b4752}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden;box-shadow:0 1px 2px #00000008}
.panel-title{height:31px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:#71808c;font-size:9px;font-weight:900;letter-spacing:.12em}
.panel-title b{color:var(--text);letter-spacing:0}
#board{padding:7px 6px 0}
.lines{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;align-items:start}
.line-col{min-width:0}
.line-card{height:278px;border:1.5px solid var(--lc);border-radius:7px;background:linear-gradient(#fff,#fbfcfd);position:relative;overflow:hidden}
.line-head{height:51px;padding:5px 6px;border-top:4px solid var(--lc);border-bottom:1px solid var(--line);display:grid;grid-template-columns:24px 1fr;column-gap:5px}
.line-badge{width:23px;height:23px;border:1px solid var(--lc);border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--lc);font-size:13px;font-weight:950}
.line-title{min-width:0}.line-name{font-size:9px;font-weight:900;line-height:12px}.line-meta{font-size:7px;color:var(--muted);line-height:10px;white-space:nowrap}.line-meta b{color:var(--text)}
.queue{height:218px;padding:7px 4px;display:grid;align-content:start;justify-content:center;grid-template-columns:repeat(var(--cols),var(--slot));grid-auto-rows:var(--slot);gap:3px;position:relative}
.slot{width:var(--slot);height:var(--slot);border:1px solid #d4dbe2;border-radius:2px;background:#f0f3f5;color:#8b97a1;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:850;position:relative;z-index:2}
.slot.active{background:color-mix(in srgb,var(--lc) 12%,#fff);border-color:color-mix(in srgb,var(--lc) 65%,#fff);color:#77838d}
.slot.player{background:var(--pc);border-color:var(--pc);color:#fff;font-size:7px;box-shadow:0 1px 2px #0002}
.slot.preview{background:#fff;border:1.5px dashed var(--human);color:var(--human);font-weight:950}
.turn-link{position:absolute;z-index:1;width:2px;background:var(--lc);opacity:.48;left:50%;transform:translateX(-50%)}
.line-foot{position:absolute;left:0;right:0;bottom:0;height:25px;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 6px;font-size:7px;color:var(--muted);font-weight:750;background:#fafbfd}
.line-foot strong{color:var(--text)}
.line-action{width:100%;height:32px;margin-top:5px;border:1.5px solid var(--lc);border-radius:6px;background:#fff;color:var(--text);font-size:9px;font-weight:900}.line-action:hover:not(:disabled){background:color-mix(in srgb,var(--lc) 8%,#fff)}.line-action.active{box-shadow:0 0 0 2px color-mix(in srgb,var(--lc) 18%,transparent)}.line-action:disabled{opacity:.38;cursor:not-allowed}
.turnbar{margin:7px 0 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;align-items:center;min-height:45px;padding:6px 4px 6px 8px}.turn-main{font-size:12px;font-weight:900}.turn-main span{color:var(--human)}.turn-sub{font-size:8px;color:var(--muted);margin-top:2px}.wait{height:31px;min-width:62px;border:1px solid #c8d0d9;border-radius:6px;background:#fff;color:#46525e;font-size:9px;font-weight:900}.wait:disabled{opacity:.35}
.score-grid{padding:7px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.player-card{border:1.5px solid var(--pc);border-top-width:4px;border-radius:7px;background:#fbfcfd;padding:5px}.player-card.current{box-shadow:0 0 0 2px color-mix(in srgb,var(--pc) 15%,transparent)}.player-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}.player-name{font-size:10px;font-weight:900;color:var(--pc)}.player-total{font-size:15px;font-weight:950}.score-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:7px;text-align:center}.score-table th,.score-table td{height:18px;border:1px solid #dbe1e6;padding:0}.score-table th{color:#7a8792;font-weight:850;background:#f5f7f9}.score-table td.hit{background:color-mix(in srgb,var(--pc) 14%,#fff);color:var(--pc);font-weight:950}.score-table td.line-name{font-weight:950}
.log{height:115px;overflow:auto;padding:6px 8px;font-size:8px;line-height:1.55;background:#fbfcfd}.log-row{border-bottom:1px dotted #e0e4e8;padding:2px 0}.log-row.reward{color:#347a5b;font-weight:800}.log-row.error{color:#b54e4e;font-weight:800}.log-row.phase{color:#4d6b89;font-weight:800}
.footer-note{text-align:center;font-size:7px;color:#929da7;padding:2px}
#modal{display:none;position:fixed;inset:0;background:#18222c66;align-items:center;justify-content:center;padding:16px;z-index:20}.modal{width:min(340px,100%);background:#fff;border:1px solid var(--line);border-radius:9px;padding:17px;box-shadow:0 18px 50px #0003}.modal-kicker{font-size:8px;color:var(--muted);font-weight:900;letter-spacing:.12em}.modal h2{font-size:20px;margin:3px 0 7px}.modal p{font-size:11px;color:#586571;margin:0}.modal-actions{display:flex;gap:6px;margin-top:15px}.modal-actions button{flex:1;height:36px;border:1px solid #cbd3dc;border-radius:6px;background:#fff;font-weight:900;font-size:10px}.modal-actions .primary{background:#f1f4f7}
@media(max-width:520px){#app{padding:6px 5px 14px}.topbar{height:39px;gap:4px}.brand{font-size:15px}.brand small{font-size:6px}.ctrl button,.ctrl select,.new{height:24px;font-size:8px;padding:0 5px}.lines{gap:3px}.line-card{height:265px}.line-head{height:49px;padding:5px 4px}.line-badge{width:20px;height:20px;font-size:11px}.line-head{grid-template-columns:21px 1fr;column-gap:4px}.line-name{font-size:8px}.line-meta{font-size:6.5px}.queue{height:211px;padding:6px 2px;gap:2px}.slot{font-size:6px}.line-foot{font-size:6px;padding:0 4px}.line-action{height:29px;font-size:8px}.turnbar{min-height:43px}.turn-main{font-size:10px}.turn-sub{font-size:7px}.wait{height:29px;min-width:55px;font-size:8px}.score-grid{gap:4px;padding:5px}.player-card{padding:4px}.player-name{font-size:8px}.player-total{font-size:13px}.score-table{font-size:6px}.score-table th,.score-table td{height:16px}.log{height:100px;font-size:7px}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">STAMP / QUEUE<small>QUEUE STRATEGY SIMULATION</small></div>
    <div class="ctrl" aria-label="AI speed"><button data-speed="1">X1</button><button data-speed="2">X2</button><button data-speed="4" class="active">X4</button></div>
    <select id="aiLevel" aria-label="AI difficulty"><option value="easy">EASY</option><option value="normal" selected>NORMAL</option><option value="hard">HARD</option></select>
    <button id="newGame" class="new">NEW</button>
  </div>
  <section class="panel">
    <div class="panel-title"><span>QUEUE BOARD</span><span>ROUND 01 · PHASE <b id="phase">--</b> / 30</span></div>
    <div id="board"></div>
  </section>
  <section class="panel">
    <div class="panel-title"><span>PLAYER SCOREBOARD</span><span>SCORE / REWARDS</span></div>
    <div id="players" class="score-grid"></div>
  </section>
  <section class="panel">
    <div class="panel-title"><span>EVENT LOG</span><span>LIVE</span></div>
    <div id="log" class="log"></div>
  </section>
  <div class="footer-note">Human + 3 AI · turn order is randomized every phase</div>
</div>
<div id="modal"><div class="modal"><div class="modal-kicker">MATCH COMPLETE</div><h2>GAME END</h2><p id="modalText"></p><div class="modal-actions"><button id="modalClose" type="button">CLOSE</button><button id="modalNew" type="button" class="primary">NEW GAME</button></div></div></div>
<script>
'use strict';
const MAX_QUEUE=21;
let D=null,S=null,timer=null,pendingLine=null,gameSpeed=4,aiLevel='normal';
const AI_DELAYS={1:1680,2:840,4:420};
const lineColors={A:'#DAA520',B:'#C75BAD',C:'#5BA8C7',D:'#7DBF5E',E:'#C7875B'};
const playerColors={Human:'#355C9A','AI 1':'#B24C6F','AI 2':'#3E8A68','AI 3':'#8A6A32'};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const playerShort=p=>p==='Human'?'H':p.replace('AI ','A');
const weighted=o=>{const a=Object.entries(o).map(([v,w])=>[+v,+w]).filter(x=>Number.isFinite(x[0])&&Number.isFinite(x[1])&&x[1]>0);if(!a.length)return 0;const total=a.reduce((s,x)=>s+x[1],0);let r=Math.random()*total;for(const [v,w] of a){r-=w;if(r<=0)return v}return a[a.length-1][0]};
const line=id=>S.lines[String(id)];
function log(text,type=''){const el=document.createElement('div');el.className='log-row '+type;el.textContent=text;document.querySelector('#log').prepend(el)}
function scoreRows(lid){const row=D.score_table.find(r=>String(r.line_pool_id)===String(lid));return row?[row.tier1,row.tier2,row.tier3,row.tier4,row.tier5]:[0,0,0,0,0]}
function scoreFor(p,l){const count=S.players[p].by[l.id]||0;return count?scoreRows(l.id)[Math.min(count-1,4)]||0:0}
function totalScore(p){return D.lines.reduce((n,l)=>n+scoreFor(p,l),0)}
function lineRewardUsed(lid){const s=line(lid);return D.players.reduce((n,p)=>n+(s.rewards[p]||0),0)}
function lineRewardRemaining(l){return Math.max(0,l.max_rewards-lineRewardUsed(l.id))}
function bufferProbabilities(type){const row=D.buffer_types.find(r=>r.name===type);if(!row)return{};return typeof row.probabilities==='string'?JSON.parse(row.probabilities):row.probabilities||{}}
function resetState(){clearTimeout(timer);pendingLine=null;document.querySelector('#modal').style.display='none';S={phase:1,order:[],idx:0,lines:{},players:{},running:true,resolving:false};D.lines.forEach(l=>S.lines[String(l.id)]={buffer:[],rewards:{}});D.players.forEach(p=>{S.players[p]={by:{}};D.lines.forEach(l=>S.lines[String(l.id)].rewards[p]=0)});document.querySelector('#log').innerHTML='';log('NEW GAME · BOARD INITIALIZED');startPhase()}
function addBuffer(){const map={};for(const r of D.line_phase_map||[]){if(+r.phase_number===S.phase){const bt=D.buffer_types.find(x=>+x.id===+r.buffer_type_id);if(bt)map[r.line_pool_id]=bt.name}}D.lines.forEach(l=>{const typ=map[l.id]||'Normal';const drawn=+weighted(bufferProbabilities(typ));const s=line(l.id);const add=Math.min(MAX_QUEUE-s.buffer.length,Math.max(0,drawn));for(let i=0;i<add;i++)s.buffer.push(null);if(add)log(`PHASE ${S.phase} · ${l.name} +${add} · ${typ}`)})}
function startPhase(){if(!S.running)return;S.resolving=false;addBuffer();S.order=[...D.players].sort(()=>Math.random()-0.5);S.idx=0;log(`PHASE ${S.phase} START · ORDER ${S.order.join(' → ')}`,'phase');render();next()}
function removePlayer(p,buffers=S.lines){D.lines.forEach(l=>{const b=buffers[String(l.id)]?.buffer||buffers[l.id]?.buffer;if(!b)return;for(let i=0;i<b.length;i++)if(b[i]===p)b[i]=null})}
function choose(p,id){if(!S.running||S.resolving)return false;const l=D.lines.find(x=>String(x.id)===String(id));if(!l)return false;const target=line(l.id).buffer;if(target.includes(p)){log(`${p} · STAY · ${l.name}`);return true}if(target.length>=MAX_QUEUE){log(`${p} · ${l.name} FULL`);return false}removePlayer(p);target.push(p);log(`${p} → ${l.name}`);render();return true}
function resolveLineState(l,s){const b=s.buffer;const players=[...new Set(b.filter(Boolean))];if(!players.length){let removed=0,n=[];for(const x of b){if(x===null&&removed<l.fixed_value)removed++;else n.push(x)}s.buffer=n;return{winners:[],passed:false}}const front=new Set(b.slice(0,l.fixed_value).filter(Boolean));const passed=players.length===front.size&&players.every(p=>front.has(p));if(passed){const winners=players.slice();s.buffer=b.slice(l.fixed_value);return{winners,passed:true}}let removed=0,n=[];for(const x of b){if(x===null&&removed<l.fixed_value)removed++;else n.push(x)}s.buffer=n;return{winners:[],passed:false}}
function resolvePhase(){if(S.resolving||!S.running)return;S.resolving=true;D.lines.forEach(l=>{const result=resolveLineState(l,line(l.id));if(!result.winners.length)return;const remaining=lineRewardRemaining(l);if(remaining<result.winners.length){log(`PASS · ${l.name} · ${result.winners.length} crossed · ${remaining} Reward left · NO REWARD`);return}const s=line(l.id);result.winners.forEach(p=>{s.rewards[p]=(s.rewards[p]||0)+1;S.players[p].by[l.id]=(S.players[p].by[l.id]||0)+1;log(`REWARD · ${p} · ${l.name} ×${s.rewards[p]} · SCORE ${scoreFor(p,l)}`,'reward')})});render();const winners=D.players.filter(p=>D.lines.every(l=>(S.players[p].by[l.id]||0)>=3));if(winners.length)return end(`${winners.join(' / ')} WIN`);if(D.lines.every(l=>lineRewardRemaining(l)<=0))return end('ALL REWARDS EXHAUSTED');if(S.phase>=D.max_phases)return end(`${D.max_phases} PHASES REACHED`);S.phase++;startPhase()}
const AI_LEVELS={easy:{self:10000,block:0,score:6,position:100,noise:150},normal:{self:10000,block:24,score:12,position:180,noise:24},hard:{self:10000,block:60,score:16,position:220,noise:6}};
function cloneBuffers(){const out={};D.lines.forEach(l=>out[l.id]=line(l.id).buffer.slice());return out}
function simRemove(buffers,p){D.lines.forEach(l=>{const b=buffers[l.id]||[];for(let i=0;i<b.length;i++)if(b[i]===p)b[i]=null})}
function projectedPhase(buffers){const rewardBy={};D.players.forEach(p=>rewardBy[p]=0);D.lines.forEach(l=>{const b=buffers[l.id]||[],players=[...new Set(b.filter(Boolean))];if(!players.length){let removed=0,n=[];for(const x of b){if(x===null&&removed<l.fixed_value)removed++;else n.push(x)}buffers[l.id]=n;return}const front=new Set(b.slice(0,l.fixed_value).filter(Boolean));const passed=players.length===front.size&&players.every(p=>front.has(p));if(passed){const rem=lineRewardRemaining(l);if(rem>=players.length)players.forEach(p=>rewardBy[p]++);buffers[l.id]=b.slice(l.fixed_value)}else{let removed=0,n=[];for(const x of b){if(x===null&&removed<l.fixed_value)removed++;else n.push(x)}buffers[l.id]=n}});return{rewardBy,buffers}}
function simulateAction(p,lid){const buffers=cloneBuffers(),target=buffers[lid];if(!target||(!target.includes(p)&&target.length>=MAX_QUEUE))return null;simRemove(buffers,p);if(!target.includes(p))target.push(p);return projectedPhase(buffers)}
function currentThreats(){const result=projectedPhase(cloneBuffers()),out={};D.players.forEach(p=>out[p]=result.rewardBy[p]||0);return out}
function actionPosition(buffers,p,lid){const b=buffers[lid]||[],pos=b.indexOf(p);if(pos<0)return 0;const fv=D.lines.find(l=>String(l.id)===String(lid)).fixed_value;return Math.max(0,fv-pos)}
function blockValue(candidate,opp,baseThreat){const beforeCount=Math.max(...D.lines.map(l=>S.players[opp].by[l.id]||0));if(beforeCount<2||!(baseThreat[opp]>0))return 0;const projectedLine=D.lines.find(l=>(candidate.buffers[l.id]||[]).includes(opp));const afterCount=Math.max(...D.lines.map(l=>(S.players[opp].by[l.id]||0)+(candidate.rewardBy[opp]&&projectedLine&&String(l.id)===String(projectedLine.id)?1:0)));if(afterCount>=3)return 0;const currentLine=D.lines.find(l=>line(l.id).buffer.includes(opp));const beforeScore=currentLine?scoreFor(opp,currentLine):0;const afterScore=candidate.rewardBy[opp]&&projectedLine?scoreRows(projectedLine.id)[Math.min((S.players[opp].by[projectedLine.id]||0),4)]||0:0;return Math.max(0,beforeScore-afterScore)+55}
function aiCandidate(p,l,threat){const current=line(l.id).buffer,already=current.includes(p),sim=simulateAction(p,l.id);if(!sim)return null;const cfg=AI_LEVELS[aiLevel]||AI_LEVELS.normal;let score=(sim.rewardBy[p]||0)*cfg.self;D.players.filter(x=>x!==p).forEach(opp=>score+=blockValue(sim,opp,threat)*cfg.block);const count=S.players[p].by[l.id]||0;score+=(scoreRows(l.id)[Math.min(count,4)]||0)*cfg.score;score+=actionPosition(sim.buffers,p,l.id)*cfg.position;if(already)score+=35;score-=sim.buffers[l.id].filter(x=>x&&x!==p).length*3;score+=(Math.random()-.5)*cfg.noise;return{l,score,stay:already}}
function ai(p){if(!S.running||S.resolving||S.order[S.idx]!==p)return;const threat=currentThreats();const opts=D.lines.map(l=>aiCandidate(p,l,threat)).filter(Boolean).sort((a,b)=>b.score-a.score);if(!opts.length){S.idx++;return next()}const best=opts[0].score;const window=aiLevel==='hard'?4:aiLevel==='normal'?18:70;const top=opts.filter(o=>best-o.score<=window);const pick=top[Math.floor(Math.random()*top.length)];if(pick.stay)log(`${p} · STAY · ${pick.l.name}`);else choose(p,pick.l.id);S.idx++;next()}
function next(){if(!S.running||S.resolving)return;if(S.idx>=S.order.length)return resolvePhase();const p=S.order[S.idx];render();if(p==='Human')return;clearTimeout(timer);timer=setTimeout(()=>ai(p),AI_DELAYS[gameSpeed])}
function human(id){if(!S.running||S.resolving||S.order[S.idx]!=='Human')return;const l=D.lines.find(x=>String(x.id)===String(id));if(!l)return;const same=line(l.id).buffer.includes('Human');if(String(pendingLine)===String(id)){pendingLine=null;if(same){log('Human · WAIT / STAY');S.idx++;next()}else if(choose('Human',id)){S.idx++;next()}}else{pendingLine=id;render()}}
function waitHuman(){if(S.running&&!S.resolving&&S.order[S.idx]==='Human'){pendingLine=null;log('Human · WAIT');S.idx++;next()}}
function queueLayout(l){const fv=l.fixed_value,cols=fv,rows=Math.ceil(MAX_QUEUE/fv),positions=[];for(let i=0;i<MAX_QUEUE;i++){const r=Math.floor(i/fv),p=i%fv,c=r%2===0?p:fv-1-p;positions.push({r,c})}return{cols,rows,positions}}
function renderLine(l,p){const s=line(l.id),layout=queueLayout(l),slot=Math.max(11,Math.min(18,Math.floor((100/(layout.cols+0.55)))));let html='';for(let i=0;i<MAX_QUEUE;i++){const pos=layout.positions[i],value=s.buffer[i]||null;const preview=!value&&!s.buffer.includes('Human')&&p==='Human'&&String(pendingLine)===String(l.id)&&i===s.buffer.length;let state=value?'player':preview?'preview':i<s.buffer.length?'active':'';html+=`<div class="slot ${state}" style="--pc:${value?playerColors[value]:'var(--human)'};--lc:${lineColors[l.name]};grid-row:${pos.r+1};grid-column:${pos.c+1}">${value?playerShort(value):preview?'H':i+1}</div>`}const connectors=[];for(let r=0;r<layout.rows-1;r++){const y=(r+1)* (slot+2) - 1;const x=((r%2===0?layout.cols-1:0)+.5)*(slot+2);connectors.push(`<i class="turn-link" style="left:${x}px;top:${y}px;height:${slot+4}px"></i>`)}return{slot,html,connectors:connectors.join('')}}
function render(){if(!D||!S)return;document.querySelector('#phase').textContent=String(S.phase).padStart(2,'0');const p=S.order[S.idx];const board=document.querySelector('#board');board.innerHTML=`<div class="lines">${D.lines.map(l=>{const lay=queueLayout(l),slot=Math.max(11,Math.min(18,Math.floor(92/(lay.cols+.8))));let q='';for(let i=0;i<MAX_QUEUE;i++){const pos=lay.positions[i],v=line(l.id).buffer[i]||null;const preview=!v&&!line(l.id).buffer.includes('Human')&&p==='Human'&&String(pendingLine)===String(l.id)&&i===line(l.id).buffer.length;const state=v?'player':preview?'preview':i<line(l.id).buffer.length?'active':'';q+=`<div class="slot ${state}" style="--pc:${v?(playerColors[v]||'#555'):'var(--human)'};--lc:${lineColors[l.name]};grid-row:${pos.r+1};grid-column:${pos.c+1}">${v?playerShort(v):preview?'H':i+1}</div>`}let con='';for(let r=0;r<lay.rows-1;r++){const endIndex=(r+1)*l.fixed_value-1;const nextIndex=endIndex+1;if(nextIndex>=MAX_QUEUE)break;const a=lay.positions[endIndex],b=lay.positions[nextIndex];const x=(a.c===b.c?a.c:b.c);const y1=(a.r+.5)*(slot+2),y2=(b.r+.5)*(slot+2);con+=`<i class="turn-link" style="left:${(x+.5)*(slot+2)}px;top:${Math.min(y1,y2)+1}px;height:${Math.abs(y2-y1)-2}px"></i>`}const remaining=lineRewardRemaining(l);const full=line(l.id).buffer.length>=MAX_QUEUE&&!line(l.id).buffer.includes('Human');const pending=String(pendingLine)===String(l.id)&&p==='Human';return `<div class="line-col"><div class="line-card" style="--lc:${lineColors[l.name]}"><div class="line-head"><div class="line-badge">${l.name}</div><div class="line-title"><div class="line-name">LINE ${l.name}</div><div class="line-meta">FV <b>${l.fixed_value}</b> · QUEUE <b>${line(l.id).buffer.length}/∞</b></div><div class="line-meta">REWARD LEFT <b>${remaining}/${l.max_rewards}</b></div></div></div><div class="queue" style="--cols:${lay.cols};--slot:${slot}px">${q}${con}</div><div class="line-foot">${line(l.id).buffer.length?`FRONT 1–${Math.min(l.fixed_value,line(l.id).buffer.length)} · <strong>${line(l.id).buffer.filter(Boolean).slice(0,l.fixed_value).map(playerShort).join(' ')||'EMPTY'}</strong>`:'QUEUE EMPTY · 0 PLAYERS'}</div></div><button class="line-action ${pending?'active':''}" style="--lc:${lineColors[l.name]}" data-line="${l.id}" ${p==='Human'&&!S.resolving&&S.running?'':'disabled'}>${pending?`CONFIRM ${l.name}`:full&&!line(l.id).buffer.includes('Human')?`FULL · ${l.name}`:`LINE ${l.name}`}</button></div>`}).join('')}</div><div class="turnbar"><div><div class="turn-main">TURN · <span>${esc(p||'RESOLVING')}</span></div><div class="turn-sub">${p==='Human'?(pendingLine!==null?'한 번 더 누르면 선택이 확정됩니다.':'라인을 누르면 마지막 위치가 미리 표시됩니다.'):'AI가 현재 보드를 보고 선택합니다.'}</div></div><button id="wait" class="wait" ${p==='Human'&&S.running&&!S.resolving?'':'disabled'}>WAIT</button></div>`;board.querySelectorAll('.line-action').forEach(b=>b.addEventListener('click',()=>human(b.dataset.line)));board.querySelector('#wait').addEventListener('click',waitHuman);renderPlayers()}
function renderPlayers(){const p=S.order[S.idx];document.querySelector('#players').innerHTML=D.players.map(x=>{const pc=playerColors[x],rows=D.lines.map(l=>{const c=S.players[x].by[l.id]||0,r=scoreRows(l.id);return `<tr><td class="line-name" style="color:${lineColors[l.name]}">${l.name}</td>${r.map((v,i)=>`<td class="${c===i+1||c>5&&i===4?'hit':''}">${v}</td>`).join('')}<td>${c}</td></tr>`}).join('');return `<div class="player-card ${x===p?'current':''}" style="--pc:${pc}"><div class="player-head"><span class="player-name">${esc(x)}</span><span class="player-total">${totalScore(x)}</span></div><table class="score-table"><tr><th>LINE</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5+</th><th>R</th></tr>${rows}</table></div>`}).join('')}
function end(text){S.running=false;S.resolving=false;clearTimeout(timer);render();document.querySelector('#modalText').textContent=text;document.querySelector('#modal').style.display='flex'}
function assert(cond,msg){if(!cond)throw new Error(msg)}
function runSelfTests(){
  const saved=S;
  try{
    const l=D.lines[0], fake={buffer:[null,null,null,null],rewards:{}};
    let r=resolveLineState(l,fake);assert(r.winners.length===0&&fake.buffer.length===0,'empty queue resolution');
    const s1={buffer:['Human','AI 1',null,null],rewards:{}};r=resolveLineState(l,s1);assert(r.winners.length===2&&s1.buffer.length===0,'multi-player front resolution');
    const s2={buffer:['Human',null,null,null,'AI 1'],rewards:{}};r=resolveLineState(l,s2);assert(r.winners.length===0&&s2.buffer.length===2&&s2.buffer[0]==='Human'&&s2.buffer[1]==='AI 1','failed resolution removes empty slots only');
    const buffers={1:Array(21).fill(null),2:[],3:[],4:[],5:[]};simRemove(buffers,'Human');assert(buffers[1].length===21,'queue capacity');
    const tierState={phase:1,order:[],idx:0,lines:{1:{buffer:[],rewards:{Human:2}}},players:{Human:{by:{1:3}}},running:true,resolving:false};S=tierState;assert(scoreFor('Human',D.lines[0])===10,'score tier 3');assert(lineRewardRemaining(D.lines[0])===6,'global reward remaining');
    S={phase:1,order:[],idx:0,lines:{1:{buffer:['Human','AI 1',null,null],rewards:{Human:7, 'AI 1':0}}},players:{Human:{by:{1:7}},'AI 1':{by:{1:0}},'AI 2':{by:{}},'AI 3':{by:{}}},running:true,resolving:false};
    const before=lineRewardRemaining(D.lines[0]);assert(before===1,'reward remaining formula');const rr=resolveLineState(D.lines[0],line(1));assert(rr.winners.length===2,'simultaneous winners detected');assert(lineRewardRemaining(D.lines[0])===1,'resolution does not consume reward when cap blocks');
    const oldRender=render,oldLog=log;render=()=>{};log=()=>{};
    S={phase:1,order:['Human'],idx:0,lines:{1:{buffer:['AI 1',null,'AI 2'],rewards:{}},2:{buffer:['Human'],rewards:{}},3:{buffer:[],rewards:{}},4:{buffer:[],rewards:{}},5:{buffer:[],rewards:{}}},players:{Human:{by:{}},'AI 1':{by:{}},'AI 2':{by:{}},'AI 3':{by:{}}},running:true,resolving:false};
    assert(choose('Human',1)===true,'human move accepted');assert(line(2).buffer[0]===null&&line(1).buffer[3]==='Human','move keeps old slot null and appends');assert(choose('Human',3)===true,'second move accepted');assert(line(1).buffer[3]===null&&line(3).buffer[0]==='Human','second move leaves null and appends');
    render=oldRender;log=oldLog;
    S=saved;return 'SELFTEST PASS';
  }catch(e){S=saved;throw e}
}
async function boot(){try{const r=await fetch('./data/gameData.json',{cache:'no-store'});if(!r.ok)throw new Error(`gameData.json HTTP ${r.status}`);D=await r.json();if(!Array.isArray(D.lines)||D.lines.length!==5||!Array.isArray(D.players)||D.players.length!==4)throw new Error('gameData.json format invalid');if(D.max_phases!==30)throw new Error('max_phases invalid');if(new Set(D.lines.map(l=>l.name)).size!==5)throw new Error('line definitions invalid');const test=new URLSearchParams(location.search).get('selftest');if(test){S={phase:1,order:[],idx:0,lines:{},players:{},running:true,resolving:false};D.lines.forEach(l=>S.lines[String(l.id)]={buffer:[],rewards:{}});D.players.forEach(p=>S.players[p]={by:{}});const result=runSelfTests();document.body.dataset.selftest=result;document.body.innerHTML=`<pre id="selftest">${result}</pre>`;return}resetState()}catch(e){console.error(e);document.body.dataset.selftest='FAIL: '+e.message;const logEl=document.querySelector('#log');if(logEl)logEl.innerHTML='';if(logEl)log(`ERROR · ${e.message}`,'error')}}
document.querySelector('#newGame').addEventListener('click',resetState);document.querySelector('#modalClose').addEventListener('click',()=>document.querySelector('#modal').style.display='none');document.querySelector('#modalNew').addEventListener('click',resetState);document.querySelector('#aiLevel').addEventListener('change',e=>aiLevel=e.target.value);document.querySelectorAll('[data-speed]').forEach(b=>b.addEventListener('click',()=>{gameSpeed=+b.dataset.speed;document.querySelectorAll('[data-speed]').forEach(x=>x.classList.toggle('active',x===b))}));
boot();
